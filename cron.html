<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cron — Hermes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #0f0e0c; --panel: #161411; --lift: #1c1915; --text: #f4efe6;
    --muted: #8a8378; --line: #2a261f; --gold: #e8b86d; --live: #7dba7a; --bad: #d67a6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font: 14.5px/1.45 "IBM Plex Sans", system-ui, sans-serif; }
  .app { height: 100%; display: grid; grid-template-columns: 300px minmax(0,1fr); }
  .pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .left { background: var(--panel); border-right: 1px solid var(--line); }
  .side-h, .top {
    flex-shrink: 0; height: 58px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px; background: var(--lift); border-bottom: 1px solid var(--line);
  }
  .side-h strong, .top h2 { font-size: 15px; font-weight: 600; }
  .side-h a, .ghost {
    color: var(--muted); text-decoration: none; font-size: 13px; background: none; border: 0; cursor: pointer;
  }
  .side-h a:hover, .ghost:hover { color: var(--text); }
  .list { flex: 1; overflow-x: hidden; overflow-y: auto; }
  .item {
    display: grid; grid-template-columns: 36px minmax(0,1fr); gap: 10px; width: 100%; max-width: 100%;
    padding: 10px 12px; border: 0; background: transparent; color: inherit; text-align: left; cursor: pointer;
  }
  .item:hover { background: rgba(255,255,255,.03); }
  .item.on { background: #242018; }
  .item.cron-off { opacity: .55; }
  .ava {
    width: 36px; height: 36px; border-radius: 50%; background: #2a261f; display: grid; place-items: center;
    font-size: 12px; font-weight: 650; flex-shrink: 0;
  }
  .ava.ok { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--live); }
  .ava.bad { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--bad); }
  .item > div:last-child { min-width: 0; overflow: hidden; }
  .who { display: flex; justify-content: space-between; gap: 8px; min-width: 0; }
  .who b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .when { color: var(--muted); font-size: 11.5px; flex-shrink: 0; }
  .snip { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .center { background: #141210; }
  .top h2 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 12px; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .thread { flex: 1; overflow: auto; }
  .col { max-width: 820px; margin: 0 auto; padding: 18px 20px 40px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
  }
  .card h3 { font-size: 18px; margin-bottom: 6px; }
  .facts { color: var(--muted); font-size: 13px; line-height: 1.6; margin-bottom: 14px; }
  .md p, .md li { margin: 0 0 8px; }
  .md pre {
    background: #12110e; border: 1px solid var(--line); border-radius: 8px; padding: 10px;
    overflow: auto; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px;
  }
  .empty { margin: 18vh 16px 0; text-align: center; color: var(--muted); }
  .err { color: var(--bad); }
</style>
</head>
<body>
<div class="app">
  <aside class="pane left">
    <div class="side-h">
      <strong>Cron</strong>
      <a href="/live">Chats</a>
    </div>
    <div class="list" id="jobs"></div>
  </aside>
  <section class="pane center">
    <header class="top">
      <div>
        <h2 id="title">Cron</h2>
        <div class="meta" id="meta">Jobs on this Hermes</div>
      </div>
      <div class="nav"><a href="/live">Chats</a> <a class="on" href="/cron">Cron</a> <a href="/status">Status</a> <a href="/">Skills</a></div>
    </header>
    <div class="thread"><div class="col" id="col"><div class="empty">Pick a job.</div></div></div>
  </section>
</div>
<script>
const jobsEl = document.getElementById('jobs');
const col = document.getElementById('col');
const titleEl = document.getElementById('title');
const metaEl = document.getElementById('meta');
let jobs = [];
let current = null;

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function md(text) {
  try { if (window.marked) return marked.parse(String(text || '')); } catch {}
  return esc(text);
}
function when(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return String(iso);
  return d.toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
}
function ring(j) {
  if (j.last_status === 'ok') return 'ok';
  if (j.last_status && j.last_status !== 'ok') return 'bad';
  return '';
}

function renderList() {
  if (!jobs.length) {
    jobsEl.innerHTML = '<div class="empty">No cron jobs</div>';
    return;
  }
  jobsEl.innerHTML = jobs.map(j => `
    <button class="item ${j.id===current?'on':''} ${j.enabled?'':'cron-off'}" data-id="${esc(j.id)}">
      <div class="ava ${ring(j)}">C</div>
      <div>
        <div class="who"><b>${esc(j.name)}</b><span class="when">${esc(j.last_status || j.state || '')}</span></div>
        <div class="snip">${esc(j.schedule || '')}${j.next_run_at ? ' · next ' + esc(when(j.next_run_at)) : ''}</div>
      </div>
    </button>`).join('');
  jobsEl.querySelectorAll('.item').forEach(b => b.onclick = () => openJob(b.dataset.id));
}

async function openJob(id) {
  current = id;
  renderList();
  const j = jobs.find(x => x.id === id);
  titleEl.textContent = j ? j.name : 'Cron';
  metaEl.textContent = j ? `${j.schedule || ''} · ${j.state || ''}` : '';
  col.innerHTML = '<div class="empty">Loading…</div>';
  const data = await (await fetch('/api/live/cron/' + encodeURIComponent(id))).json();
  col.innerHTML = `<article class="card">
    <h3>${esc(data.name || id)}</h3>
    <div class="facts">
      ${esc(data.schedule || '—')}<br>
      ${data.enabled ? 'enabled' : 'disabled'} · ${esc(data.state || '—')} · last ${esc(data.last_status || '—')}
      ${data.last_run_at ? '<br>last run ' + esc(when(data.last_run_at)) : ''}
      ${data.next_run_at ? '<br>next ' + esc(when(data.next_run_at)) : ''}
      ${data.last_error ? '<div class="err">' + esc(data.last_error) + '</div>' : ''}
      ${data.output_file ? '<div>' + esc(data.output_file) + '</div>' : ''}
    </div>
    <div class="md">${data.output ? md(data.output) : '<p>No output yet.</p>'}</div>
  </article>`;
}

async function refresh() {
  const data = await (await fetch('/api/live/cron')).json();
  jobs = data.jobs || [];
  renderList();
  if (current && jobs.some(j => j.id === current)) return;
  if (jobs[0]) openJob(jobs[0].id);
}

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
